name: Validation

# Recommandations HACS (https://hacs.xyz/docs/publish/action) : à chaque push et
# pull request, tous les jours, et à la demande depuis l'onglet Actions.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # Aucune vérification ignorée : condition du catalogue par défaut de HACS.
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Pytest
        run: python -m pytest -q
